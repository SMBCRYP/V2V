port: 7890
socks-port: 7891
mixed-port: 7892
allow-lan: true
mode: rule
log-level: info
unified-delay: true
geo-auto-update: true
find-process-mode: strict
global-client-fingerprint: chrome
external-controller: 127.0.0.1:9090
external-ui-url: https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip
external-ui: ui
external-controller-cors:
  allow-origins:
    - '*'
  allow-private-network: true
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  use-system-hosts: true
  respect-rules: false
  default-nameserver:
    - 223.5.5.5
  nameserver:
    - 114.114.114.114#⚪ V2V
    - 223.5.5.5
    - 8.8.8.8
    - 9.9.9.9
    - 1.1.1.1
    - https://8.8.8.8/dns-query
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  proxy-server-nameserver:
    - 8.8.8.8
  nameserver-policy:
    raw.githubusercontent.com: 8.8.8.8
    time.apple.com: 8.8.8.8
    www.gstatic.com: system
    rule-set:ir:
      - 8.8.8.8
  fallback:
    - tls://223.5.5.5
    - tls://1.1.1.1
    - tls://8.8.8.8
    - tls://dns.google:853
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - geosite:private
tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
    - tcp://any:53
  device: utun0
  mtu: 9000
  strict-route: true
  endpoint-independent-nat: false
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports:
        - 80
        - 8080
        - 8880
        - 2052
        - 2082
        - 2086
        - 2095
    TLS:
      ports:
        - 443
        - 8443
        - 2053
        - 2083
        - 2087
        - 2096
